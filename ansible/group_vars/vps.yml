---
system_hostname: gw0
system_fqdn: gw0.kiad.tansanrao.net
system_timezone: UTC

edge_domain: nimbus.casa
vps_public_ipv4: "5.161.216.148"
vps_public_ipv6: "2a01:4ff:f0:e61::/64"

# Hetzner Floating IP dedicated to GitLab (code. and registry.twicecooked.software).
# nftables rewrites its ports 22, 80 and 443 to 10022, 10080 and 10443, so gw0's
# own sshd and the Kubernetes HAProxy frontends keep their wildcard binds.
gitlab_public_ipv4: 5.161.18.14
floating_ipv4_addresses:
  - "{{ gitlab_public_ipv4 }}"

wireguard_interface: wg0
wireguard_listen_port: 51820
wireguard_vps_address: 10.200.0.1/32
wireguard_connector_address: 10.200.0.2/32
wireguard_role: vps
wireguard_local_address: "{{ wireguard_vps_address }}"
wireguard_peer_allowed_ips: "{{ wireguard_connector_address }}"
connector_haproxy_backend: 10.200.0.2:443

ssh_listen_port: 22
firewall_tcp_allow_rules:
  - port: "{{ ssh_listen_port }}"
  - port: 80
  - port: 443
  - { port: 10022, destination: "{{ gitlab_public_ipv4 }}", dnat_only: true }
  - { port: 10080, destination: "{{ gitlab_public_ipv4 }}", dnat_only: true }
  - { port: 10443, destination: "{{ gitlab_public_ipv4 }}", dnat_only: true }
  # node_exporter and HAProxy metrics, through connector0's relays only.
  - { port: 9100, source: 10.200.0.2, iifname: "{{ wireguard_interface }}" }
  - { port: 8405, source: 10.200.0.2, iifname: "{{ wireguard_interface }}" }
firewall_dnat_rules:
  - { destination: "{{ gitlab_public_ipv4 }}", port: 22, to_port: 10022 }
  - { destination: "{{ gitlab_public_ipv4 }}", port: 80, to_port: 10080 }
  - { destination: "{{ gitlab_public_ipv4 }}", port: 443, to_port: 10443 }
firewall_udp_allow_rules:
  - port: "{{ wireguard_listen_port }}"

haproxy_role: edge
haproxy_kubernetes_domains:
  - "{{ edge_domain }}"
  - ".{{ edge_domain }}"
haproxy_health_bind: 127.0.0.1:8404
# Every address, because HAProxy must start before wg0 exists; nftables
# admits only connector0 over wg0.
haproxy_prometheus_bind: :8405
haproxy_connect_timeout: 5s
haproxy_client_timeout: 60s
haproxy_server_timeout: 60s
# Git and registry transfers can stay silent for minutes, so these forwards get
# one-hour timeouts. Port 22 also rate-limits new connections per source to
# absorb SSH scanners.
haproxy_tcp_forwards:
  - name: gitlab_https
    bind: "{{ gitlab_public_ipv4 }}:10443"
    backend: 10.200.0.2:10443
    send_proxy: true
    timeout: 1h
  - name: gitlab_ssh
    bind: "{{ gitlab_public_ipv4 }}:10022"
    backend: 10.200.0.2:10022
    send_proxy: true
    timeout: 1h
    frontend_lines:
      - stick-table type ip size 100k expire 2m store conn_rate(1m)
      - tcp-request connection track-sc0 src
      - tcp-request connection reject if { sc0_conn_rate gt 120 }
  - name: gitlab_http
    bind: "{{ gitlab_public_ipv4 }}:10080"
    backend: 10.200.0.2:10080
    send_proxy: true

gatus_version: v5.35.0
gatus_image: "ghcr.io/twin/gatus:{{ gatus_version }}"
gatus_web_address: 127.0.0.1
gatus_web_port: 8080
gatus_enable_connector_checks: false
gatus_public_endpoints: []
# k8s0's Alertmanager posts its Watchdog here every
# 5 minutes. Three missed pushes page through Pushover.
gatus_heartbeat_endpoints:
  - name: alertmanager
    group: monitoring
    interval: 15m
    description: Alertmanager stopped sending its heartbeat; homelab alerting may be down

# Public, read-only Gatus UI.
edge_status_hostname: status.tansanrao.net

acme_certificate_email: email@tansanrao.com
acme_certificate_domains:
  - "{{ system_fqdn }}"
  - "{{ edge_status_hostname }}"
acme_http01_address: 127.0.0.1
acme_http01_port: 8402
haproxy_acme_http01:
  hostnames: "{{ acme_certificate_domains }}"
  backend: "{{ acme_http01_address }}:{{ acme_http01_port }}"
haproxy_gatus_push:
  hostname: "{{ system_fqdn }}"
  ui_hostname: "{{ edge_status_hostname }}"
  bind: 127.0.0.1:8443
  certificate: /etc/haproxy/certs/{{ system_fqdn }}.pem
  backend: "{{ gatus_web_address }}:{{ gatus_web_port }}"

# node_exporter on the WireGuard address; it retries until wg0 is up.
# Prometheus reaches it through connector0's relay. The journal goes the same
# way, as plain HTTP over WireGuard to connector0's logs relay.
monitoring_agent_listen_address: 10.200.0.1
monitoring_agent_journal_upload_url: http://10.200.0.2:9443/insert/journald
monitoring_agent_extra_systemd_units:
  - haproxy
  - "wg-quick@{{ wireguard_interface }}"
  - gatus
