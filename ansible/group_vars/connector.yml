---
system_hostname: connector0
system_fqdn: connector0.kbcb.tansanrao.net
system_timezone: UTC

ssh_listen_port: 22

wireguard_role: connector
wireguard_interface: wg0
wireguard_vps_address: 10.200.0.1/32
wireguard_connector_address: 10.200.0.2/32
wireguard_local_address: "{{ wireguard_connector_address }}"
wireguard_peer_allowed_ips: "{{ wireguard_vps_address }}"
wireguard_peer_endpoint: "5.161.216.148:51820"
wireguard_persistent_keepalive: 25

firewall_tcp_allow_rules:
  - port: "{{ ssh_listen_port }}"
  - port: 443
    source: 10.200.0.1
    iifname: "{{ wireguard_interface }}"
  - { port: 10022, source: 10.200.0.1, iifname: "{{ wireguard_interface }}" }
  - { port: 10080, source: 10.200.0.1, iifname: "{{ wireguard_interface }}" }
  - { port: 10443, source: 10.200.0.1, iifname: "{{ wireguard_interface }}" }
  # Prometheus in k8s0: this host's node_exporter and HAProxy, and the relays
  # to gw0's.
  - { port: 9100, source: "{{ monitoring_prometheus_source }}" }
  - { port: 8405, source: "{{ monitoring_prometheus_source }}" }
  - { port: 9101, source: "{{ monitoring_prometheus_source }}" }
  - { port: 9102, source: "{{ monitoring_prometheus_source }}" }
  # gw0's journal upload.
  - { port: 9443, source: 10.200.0.1, iifname: "{{ wireguard_interface }}" }
firewall_udp_allow_rules: []

haproxy_role: connector
haproxy_health_bind: 127.0.0.1:8404
haproxy_prometheus_bind: 10.10.40.21:8405
haproxy_connector_bind: "10.200.0.2:443"
haproxy_envoy_external_backend: "10.10.40.62:443"
haproxy_connect_timeout: 5s
haproxy_client_timeout: 60s
haproxy_server_timeout: 60s

# GitLab traffic from the Floating IP on gw0. The PROXY header from gw0 is
# passed on, so gitlab0 sees each client's real address.
haproxy_tcp_forwards:
  - name: gitlab_https
    bind: 10.200.0.2:10443
    backend: 10.10.40.24:10443
    accept_proxy: true
    send_proxy: true
    timeout: 1h
  - name: gitlab_ssh
    bind: 10.200.0.2:10022
    backend: 10.10.40.24:10022
    accept_proxy: true
    send_proxy: true
    timeout: 1h
  - name: gitlab_http
    bind: 10.200.0.2:10080
    backend: 10.10.40.24:10080
    accept_proxy: true
    send_proxy: true
  # gw0's node_exporter and HAProxy metrics, for Prometheus in k8s0.
  - name: gw0_node_exporter
    bind: 10.10.40.21:9101
    backend: 10.200.0.1:9100
  - name: gw0_haproxy_metrics
    bind: 10.10.40.21:9102
    backend: 10.200.0.1:8405

haproxy_logs_relay:
  bind: 10.200.0.2:9443
  backend: 10.10.40.61:443
  hostname: logs.tansanrao.net

monitoring_agent_listen_address: 10.10.40.21
monitoring_agent_extra_systemd_units:
  - haproxy
  - "wg-quick@{{ wireguard_interface }}"
