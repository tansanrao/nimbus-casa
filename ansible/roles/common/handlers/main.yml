---
- name: Validate sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded

# Ubuntu 24.04 activates sshd from ssh.socket, whose ports a generator reads
# from sshd_config on daemon-reload. Open sessions survive the restart.
- name: Restart ssh socket
  ansible.builtin.systemd_service:
    name: ssh.socket
    daemon_reload: true
    state: restarted

- name: Restart apt-daily-upgrade timer
  ansible.builtin.systemd_service:
    name: apt-daily-upgrade.timer
    daemon_reload: true
    state: restarted
