---
# One Let's Encrypt certificate per host, validated with the HTTP-01 challenge:
# Let's Encrypt fetches a token over port 80, HAProxy forwards that path to
# certbot's standalone server on loopback, and no DNS API credentials exist.
# HAProxy gets the chain and key in one file; certbot's timer renews and the
# deploy hook reloads HAProxy.
# The first name is also the certificate name, so HAProxy's file is
# <acme_certificate_haproxy_dir>/<first name>.pem. Every name needs a public
# DNS record pointing at this host and HAProxy's port 80 route to certbot.
acme_certificate_domains:
  - "{{ system_fqdn }}"
acme_certificate_email: ""
acme_certificate_haproxy_dir: /etc/haproxy/certs
acme_http01_address: 127.0.0.1
acme_http01_port: 8402
acme_deploy_hook_path: /usr/local/sbin/certbot-haproxy-deploy
