---
haproxy_config_path: /etc/haproxy/haproxy.cfg
haproxy_maps_dir: /etc/haproxy/maps
haproxy_role: edge

# Plain TCP forwards rendered on any host, in addition to the role's own frontends.
# Each item: name, bind, backend, and optionally accept_proxy, send_proxy,
# timeout (client, server and tunnel) and frontend_lines (raw frontend directives).
haproxy_tcp_forwards: []

# Edge only: terminates TLS for one hostname and forwards heartbeat pushes to
# Gatus. Keys: hostname, bind (loopback), certificate (chain and key in one
# file) and backend (Gatus address). Empty disables it.
haproxy_gatus_push: {}

# Edge only: sends Let's Encrypt HTTP-01 challenges for one hostname on port 80
# to certbot instead of redirecting them to HTTPS. Keys: hostname, backend.
haproxy_acme_http01: {}
