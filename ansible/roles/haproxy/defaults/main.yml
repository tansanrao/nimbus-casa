---
haproxy_config_path: /etc/haproxy/haproxy.cfg
haproxy_maps_dir: /etc/haproxy/maps
haproxy_role: edge

# Plain TCP forwards rendered on any host, in addition to the role's own frontends.
# Each item: name, bind, backend, and optionally accept_proxy, send_proxy,
# timeout (client, server and tunnel) and frontend_lines (raw frontend directives).
haproxy_tcp_forwards: []

# Edge only: terminates TLS for hostname and forwards heartbeat pushes to
# Gatus. Keys: hostname, bind (loopback), certificate (chain and key in one
# file, valid for every hostname here) and backend (Gatus address). Optional
# ui_hostname also gets the read-only UI. Empty disables it.
haproxy_gatus_push: {}

# Address of HAProxy's built-in Prometheus endpoint (/metrics), scraped by
# k8s0. Empty disables it.
haproxy_prometheus_bind: ""

# Forwards plain-HTTP journald uploads to VictoriaLogs over TLS, and nothing
# else. Keys: bind, backend (envoy-internal address and port) and hostname
# (logs hostname, used for SNI, Host and certificate checks). Empty disables
# it.
haproxy_logs_relay: {}

# Edge only: sends Let's Encrypt HTTP-01 challenges for these hostnames on
# port 80 to certbot instead of redirecting them to HTTPS. Keys: hostnames
# (list), backend.
haproxy_acme_http01: {}
