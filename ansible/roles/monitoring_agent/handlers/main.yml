---
# Skipped in check mode while the package is only simulated.
- name: Restart node_exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted
    daemon_reload: true
  when: not (ansible_check_mode and monitoring_agent_install is changed)

- name: Restart journal upload
  ansible.builtin.systemd:
    name: systemd-journal-upload
    state: restarted
    daemon_reload: true
  when: not (ansible_check_mode and monitoring_agent_install is changed)
