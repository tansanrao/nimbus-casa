---
- name: Configure VPS edge hosts
  hosts: vps
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load SOPS-encrypted VPS variables
      community.sops.load_vars:
        file: "{{ playbook_dir }}/group_vars/vps.sops.yml"
        name: vps_sops_secrets
        return_method: vars-only
      no_log: true
      tags: always

    - name: Promote SOPS variables for roles
      ansible.builtin.set_fact:
        wireguard_private_key: "{{ vps_sops_secrets.wireguard_vps_private_key }}"
        wireguard_peer_public_key: "{{ vps_sops_secrets.wireguard_connector_public_key }}"
        gatus_heartbeat_token: "{{ vps_sops_secrets.gatus_heartbeat_token }}"
        gatus_pushover_application_token: "{{ vps_sops_secrets.gatus_pushover_token }}"
        gatus_pushover_user_key: "{{ vps_sops_secrets.pushover_user_key }}"
      no_log: true
      tags: always

  roles:
    - role: common
    - role: firewall
    - role: wireguard
    # Before haproxy, which binds the Floating IP.
    - role: floating_ip
    - role: haproxy
    # After haproxy, which routes the HTTP-01 challenge to certbot.
    - role: acme_certificate
    - role: gatus
    - role: monitoring_agent

- name: Configure home connector hosts
  hosts: connector
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load SOPS-encrypted connector variables
      community.sops.load_vars:
        file: "{{ playbook_dir }}/group_vars/connector.sops.yml"
        name: connector_sops_secrets
        return_method: vars-only
      no_log: true
      tags: always

    - name: Promote SOPS variables for connector roles
      ansible.builtin.set_fact:
        wireguard_private_key: "{{ connector_sops_secrets.wireguard_connector_private_key }}"
        wireguard_peer_public_key: "{{ connector_sops_secrets.wireguard_vps_public_key }}"
      no_log: true
      tags: always

  roles:
    - role: common
    - role: firewall
    - role: wireguard
    - role: haproxy
    - role: monitoring_agent

- name: Configure Nexus production hosts
  hosts: nexus_kb
  become: true
  gather_facts: true

  pre_tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      when: not ansible_check_mode

    - name: Verify Nexus operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
          - ansible_facts['distribution_version'] == "24.04"
          - ansible_facts['architecture'] == "x86_64"
        fail_msg: "Nexus requires Ubuntu 24.04 LTS amd64."

    - name: Load SOPS-encrypted Nexus variables
      community.sops.load_vars:
        file: "{{ playbook_dir }}/group_vars/nexus_kb.sops.yml"
        name: nexus_sops_secrets
        return_method: vars-only
      no_log: true
      tags: always

  roles:
    - role: common
    - role: docker
    - role: nexus
    - role: monitoring_agent

- name: Configure GitLab hosts
  hosts: gitlab
  become: true
  gather_facts: true

  pre_tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      when: not ansible_check_mode

    - name: Verify GitLab operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
          - ansible_facts['distribution_version'] == "24.04"
          - ansible_facts['architecture'] == "x86_64"
        fail_msg: "GitLab packages are pinned for Ubuntu 24.04 (noble) amd64."

    - name: Load SOPS-encrypted GitLab variables
      community.sops.load_vars:
        file: "{{ playbook_dir }}/group_vars/gitlab.sops.yml"
        name: gitlab_sops_secrets
        return_method: vars-only
      no_log: true
      tags: always

    - name: Promote SOPS variables for the GitLab role
      ansible.builtin.set_fact:
        gitlab_root_password: "{{ gitlab_sops_secrets.root_password }}"
      no_log: true
      tags: always

    # Optional secrets, added to SOPS after the first install or once Garage
    # credentials exist. Each one is only defined when present.
    - name: Promote optional SOPS variables
      ansible.builtin.set_fact:
        "{{ item.fact }}": "{{ gitlab_sops_secrets[item.key] }}"
      loop:
        - { key: gitlab_secrets_json, fact: gitlab_secrets_json }
        - { key: sshd_host_keys, fact: gitlab_sshd_host_keys }
        - { key: garage, fact: gitlab_garage }
        - { key: smtp_username, fact: gitlab_smtp_user_name }
        - { key: smtp_password, fact: gitlab_smtp_password }
        - { key: github_oauth, fact: gitlab_github_oauth }
      loop_control:
        label: "{{ item.key }}"
      when: item.key in gitlab_sops_secrets
      no_log: true
      tags: always

  roles:
    - role: common
    - role: firewall
    - role: haproxy
    - role: gitlab

# Monitoring only; Proxmox manages everything else on its host. Needs your
# SSH key in root's authorized_keys on the host.
- name: Configure the Proxmox host's monitoring
  hosts: proxmox
  become: true
  gather_facts: true

  roles:
    - role: monitoring_agent
    - role: proxmox_monitoring
