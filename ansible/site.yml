---
- name: Configure VPS edge hosts
  hosts: vps
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load SOPS-encrypted VPS variables
      community.sops.load_vars:
        file: "{{ playbook_dir }}/group_vars/vps.sops.yml"
        name: vps_sops_secrets
        return_method: vars-only
      no_log: true
      tags: always

    - name: Promote SOPS variables for roles
      ansible.builtin.set_fact:
        wireguard_private_key: "{{ vps_sops_secrets.wireguard_vps_private_key }}"
        wireguard_peer_public_key: "{{ vps_sops_secrets.wireguard_connector_public_key }}"
      no_log: true
      tags: always

  roles:
    - role: common
    - role: firewall
    - role: wireguard
    - role: haproxy
    - role: gatus

- name: Configure home connector hosts
  hosts: connector
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load SOPS-encrypted connector variables
      community.sops.load_vars:
        file: "{{ playbook_dir }}/group_vars/connector.sops.yml"
        name: connector_sops_secrets
        return_method: vars-only
      no_log: true
      tags: always

    - name: Promote SOPS variables for connector roles
      ansible.builtin.set_fact:
        wireguard_private_key: "{{ connector_sops_secrets.wireguard_connector_private_key }}"
        wireguard_peer_public_key: "{{ connector_sops_secrets.wireguard_vps_public_key }}"
      no_log: true
      tags: always

  roles:
    - role: common
    - role: firewall
    - role: wireguard
    - role: haproxy

- name: Configure Nexus production hosts
  hosts: nexus_kb
  become: true
  gather_facts: true

  pre_tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      when: not ansible_check_mode

    - name: Verify Nexus operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
          - ansible_facts['distribution_version'] == "24.04"
          - ansible_facts['architecture'] == "x86_64"
        fail_msg: "Nexus requires Ubuntu 24.04 LTS amd64."

  roles:
    - role: common
    - role: docker
