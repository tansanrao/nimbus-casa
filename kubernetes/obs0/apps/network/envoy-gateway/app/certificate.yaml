---
# One wildcard for every obs0 hostname, so the individual names stay out of
# public certificate transparency logs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "wildcard-${SECRET_DOMAIN/./-}"
spec:
  secretName: "wildcard-${SECRET_DOMAIN/./-}-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames: ["*.${SECRET_DOMAIN}"]
