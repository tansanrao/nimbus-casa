---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  labels:
    isolation.nimbus.casa/legacy-hold: "true"
spec:
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: dragonfly-cluster
      namespace: database
    - name: crunchy-pgo-clusters
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/default/authentik/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  suspend: true
  deletionPolicy: Orphan
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
