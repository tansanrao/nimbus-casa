---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: karakeep
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      karakeep:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          runtime-directory:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
            command: ["/bin/sh", "-c"]
            args: ["mkdir -p /runtime/run && chmod 0700 /runtime/run"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            envFrom:
              - secretRef:
                  name: karakeep-secret
              - secretRef:
                  name: karakeep-db-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: karakeep
        primary: true
        ports:
          http:
            port: &httpPort 3000
    persistence:
      runtime:
        type: emptyDir
        sizeLimit: 64Mi
        advancedMounts:
          karakeep:
            runtime-directory:
              - path: /runtime
            app:
              - path: /run
                subPath: run
      data:
        enabled: true
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            app:
              - path: /data
                subPath: karakeep
      tmp:
        type: emptyDir
        advancedMounts:
          karakeep:
            app:
              - path: /tmp
    route:
      main:
        hostnames: ["karakeep.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
