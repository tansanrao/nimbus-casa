---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-secret
    template:
      engineVersion: v2
      data:
        TZ: America/New_York
        NODE_ENV: production
        REDIS_HOSTNAME: immich-cache.immich.svc.cluster.local
        MACHINE_LEARNING_MODEL_REVISION: v2
        REDIS_PORT: "6379"
        IMMICH_SERVER_URL: http://immich-server.immich.svc.cluster.local:2283
        IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning.immich.svc.cluster.local:3003
        JWT_SECRET: '{{ .IMMICH_JWT_SECRET }}'
  dataFrom:
    - extract:
        key: immich
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-secret
spec:
  secretStoreRef:
    kind: SecretStore
    name: immich-postgres
  target:
    name: immich-db-secret
    template:
      engineVersion: v2
      data:
        DB_HOSTNAME: '{{index . "host"}}'
        DB_DATABASE_NAME: immich
        DB_USERNAME: '{{index . "user"}}'
        DB_PASSWORD: '{{index . "password" }}'
        DB_PORT: '{{index . "port"}}'
  dataFrom:
    - extract:
        key: immich16-pguser-immich
