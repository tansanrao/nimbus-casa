---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-cache
  namespace: immich
spec:
  interval: 1h
  path: ./kubernetes/apps/immich/cache/app
  prune: true
  suspend: false
  targetNamespace: immich
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: immich-isolation
      namespace: immich
    - name: dragonfly-operator
      namespace: database
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  wait: true
  timeout: 10m
