---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-postgres
  namespace: immich
spec:
  interval: 1h
  path: ./kubernetes/apps/immich/database/app
  prune: true
  suspend: false
  targetNamespace: immich
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: immich-isolation
      namespace: immich
    - name: crunchy-pgo
      namespace: database
    - name: onepassword
      namespace: external-secrets
    - name: openebs
      namespace: openebs-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  wait: true
  timeout: 10m
