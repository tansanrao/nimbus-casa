---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: server
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: immich
      k8s:app.kubernetes.io/controller: server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-external
            k8s:io.kubernetes.pod.namespace: network
        - matchLabels:
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*.immich.svc.cluster.local'
              - matchPattern: auth.${SECRET_DOMAIN}
              - matchPattern: download.geonames.org
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: immich-db
            k8s:io.kubernetes.pod.namespace: immich
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: immich
            k8s:app.kubernetes.io/controller: machine-learning
            k8s:io.kubernetes.pod.namespace: immich
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app: immich-cache
            k8s:io.kubernetes.pod.namespace: immich
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toFQDNs:
        - matchPattern: auth.${SECRET_DOMAIN}
        - matchPattern: download.geonames.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-external
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
          serverNames:
            - auth.${SECRET_DOMAIN}
  egressDeny:
    - toEntities:
        - host
        - remote-node
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: machine-learning
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: immich
      k8s:app.kubernetes.io/controller: machine-learning
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: immich
            k8s:app.kubernetes.io/controller: server
            k8s:io.kubernetes.pod.namespace: immich
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: huggingface.co
              - matchPattern: '*.huggingface.co'
              - matchPattern: '*.hf.co'
              - matchPattern: '*.xethub.hf.co'
              - matchName: us.aws.cdn.hf.co
    - toFQDNs:
        - matchPattern: huggingface.co
        - matchPattern: '*.huggingface.co'
        - matchPattern: '*.hf.co'
        - matchPattern: '*.xethub.hf.co'
        - matchName: us.aws.cdn.hf.co
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  egressDeny:
    - toEntities:
        - host
        - remote-node
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cache
spec:
  endpointSelector:
    matchLabels:
      k8s:app: immich-cache
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: immich
            k8s:app.kubernetes.io/controller: server
            k8s:io.kubernetes.pod.namespace: immich
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: dragonfly-operator
            k8s:io.kubernetes.pod.namespace: database
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
  egress: []
