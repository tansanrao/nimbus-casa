---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-isolation
  namespace: immich
spec:
  interval: 1h
  suspend: false
  path: ./kubernetes/apps/immich/isolation/app
  prune: true
  targetNamespace: immich
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  wait: true
