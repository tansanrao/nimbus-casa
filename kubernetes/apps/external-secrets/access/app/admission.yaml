          {
            "namespace": "media",
            "name": "recyclarr-volsync",
            "storeKind": "ClusterSecretStore",
            "store": "onepassword",
            "target": "recyclarr-volsync-secret",
            "keys": "garage|volsync-garage-template"
          },
          {
            "namespace": "media",
            "name": "sabnzbd-secret",
            "storeKind": "ClusterSecretStore",
            "store": "onepassword",
            "target": "sabnzbd-secret",
