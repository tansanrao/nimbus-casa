          },
          {
            "namespace": "network",
            "name": "unifi-dns",
            "storeKind": "ClusterSecretStore",
            "store": "onepassword",
            "target": "unifi-dns-secret",
            "keys": "unifi"
          },
          {
            "namespace": "observability",
            "name": "grafana-admin-password",
            "storeKind": "ClusterSecretStore",
            "store": "onepassword",
            "target": "grafana-admin-password-secret",
            "keys": "grafana"
          }
        ]
    - name: matches
      expression: variables.contracts.filter(c, c.namespace == object.metadata.namespace && c.name == object.metadata.name)
    - name: contract
      expression: 'variables.matches.size() == 1 ? variables.matches[0] : variables.contracts[0]'
  validations:
    - expression: variables.matches.size() == 1
      message: ExternalSecret is not in the reviewed namespace/name contract inventory.
    - expression: has(object.spec.secretStoreRef) && object.spec.secretStoreRef.name == variables.contract.store && object.spec.secretStoreRef.kind == variables.contract.storeKind
      message: ExternalSecret must use its approved store.
    - expression: has(object.spec.target) && has(object.spec.target.name) && object.spec.target.name == variables.contract.target
      message: ExternalSecret must write only its approved destination Secret.
    - expression: '!has(object.spec.dataFrom) || object.spec.dataFrom.all(d, has(d.extract) && !has(d.find) && !has(d.sourceRef) && d.extract.key in variables.contract.keys.split(''|''))'
      message: Only approved exact extract keys are allowed; discovery and source overrides are prohibited.
    - expression: '!has(object.spec.data) || object.spec.data.all(d, !has(d.sourceRef) && d.remoteRef.key in variables.contract.keys.split(''|''))'
      message: Only approved exact remote keys are allowed; per-entry store overrides are prohibited.
    - expression: '!has(object.spec.target) || !has(object.spec.target.template) || !has(object.spec.target.template.templateFrom)'
      message: ExternalSecret templateFrom cannot import other Kubernetes Secrets or ConfigMaps.
  matchConditions:
    - name: allow-controller-finalizer-maintenance
      expression: '!(request.operation == ''UPDATE'' && request.userInfo.username == ''system:serviceaccount:external-secrets:external-secrets'' && object.spec == oldObject.spec)'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: external-secret-contracts
spec:
  policyName: external-secret-contracts
  validationActions:
    - Deny
