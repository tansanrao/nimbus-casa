---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepassword:
      connectHost: https://onepassword.external-secrets.svc.cluster.local:8443
      vaults:
        nimbus-casa: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-secret
            namespace: external-secrets
            key: token
  conditions:
    - namespaces:
        - database
        - default
        - immich
        - media
        - media-database
        - media-services
        - media-vpn
        - network
        - observability
        - authentik
        - karakeep
        - mealie
        - miniflux
