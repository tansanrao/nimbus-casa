---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    leaderElect: true
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
    certController:
      serviceMonitor:
        enabled: true
      image:
        repository: ghcr.io/external-secrets/external-secrets
        tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
    webhook:
      replicaCount: 1
      serviceMonitor:
        enabled: true
      image:
        repository: ghcr.io/external-secrets/external-secrets
        tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
    extraEnv:
      - name: SSL_CERT_DIR
        value: /etc/ssl/certs:/etc/onepassword-ca
    extraVolumes:
      - name: onepassword-ca
        secret:
          secretName: onepassword-tls
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: onepassword-ca
        mountPath: /etc/onepassword-ca
        readOnly: true
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: ghcr.io/external-secrets/external-secrets
      tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
