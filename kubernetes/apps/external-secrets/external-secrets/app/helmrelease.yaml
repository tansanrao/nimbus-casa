---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    leaderElect: true
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
    certController:
      serviceMonitor:
        enabled: true
      image:
        repository: ghcr.io/external-secrets/external-secrets
        tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
    webhook:
      replicaCount: 1
      serviceMonitor:
        enabled: true
      image:
        repository: ghcr.io/external-secrets/external-secrets
        tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
    extraEnv:
      - name: SSL_CERT_DIR
        value: /etc/ssl/certs:/etc/onepassword-ca
    extraVolumes:
      - name: onepassword-ca
        secret:
          secretName: onepassword-tls
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: onepassword-ca
        mountPath: /etc/onepassword-ca
        readOnly: true
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: ghcr.io/external-secrets/external-secrets
      tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
