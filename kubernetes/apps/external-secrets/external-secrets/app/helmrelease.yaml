---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    leaderElect: true
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
    certController:
      serviceMonitor:
        enabled: true
    webhook:
      replicaCount: 1
      serviceMonitor:
        enabled: true
    extraEnv:
      - name: SSL_CERT_DIR
        value: /etc/ssl/certs:/etc/onepassword-ca
    extraVolumes:
      - name: onepassword-ca
        secret:
          secretName: onepassword-tls
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: onepassword-ca
        mountPath: /etc/onepassword-ca
        readOnly: true
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
