---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: links
spec:
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: snapshot-controller
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: paradedb
      namespace: database
    - name: onepassword
      namespace: external-secrets
    - name: links-isolation
      namespace: links
    - name: external-secrets-access
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/links/links/app
  postBuild:
    substitute:
      APP: links
      VOLSYNC_CAPACITY: 20Gi
      # The API and capture worker both mount the artifact volume.
      VOLSYNC_STORAGECLASS: openebs-lvm-shared
      VOLSYNC_PUID: "10001"
      VOLSYNC_PGID: "10001"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: links
  wait: false
  suspend: false
