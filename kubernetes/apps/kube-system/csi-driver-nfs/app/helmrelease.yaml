---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: csi-driver-nfs
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controller:
      replicas: 1
    storageClass:
      create: true
      name: nfs-slow
      parameters:
        server: sandcrawler.kbcb.tansanrao.net
        share: /tank/nimbus
      mountOptions:
        - nfsvers=4.2
        - nconnect=16
        - hard
        - noatime
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
    image:
      baseRepo: ""
      nfs:
        repository: registry.k8s.io/sig-storage/nfsplugin
        # renovate-image: depName=registry.k8s.io/sig-storage/nfsplugin
        tag: v4.13.6@sha256:40663419bac36836b8e4ef6929199e35920e28f6a74a46892e1c125ea5f0ce0b
      csiProvisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        # renovate-image: depName=registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.3.0@sha256:a4b0b1a37605b7b04a293e136edf7006ec1786a8eb3f4e5a945f81d667dcc371
      csiResizer:
        repository: registry.k8s.io/sig-storage/csi-resizer
        # renovate-image: depName=registry.k8s.io/sig-storage/csi-resizer
        tag: v2.2.1@sha256:ea1d25e23479000c7e8eeb92d827df66258df4e482ca054c5e7ce3fc0f5c41a5
      csiSnapshotter:
        repository: registry.k8s.io/sig-storage/csi-snapshotter
        # renovate-image: depName=registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.7.0@sha256:b03d3334f8035fa42660b166f6eb819a659a14774da020eb1b6c52cd422eaadb
      livenessProbe:
        repository: registry.k8s.io/sig-storage/livenessprobe
        # renovate-image: depName=registry.k8s.io/sig-storage/livenessprobe
        tag: v2.19.0@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
      nodeDriverRegistrar:
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        # renovate-image: depName=registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.17.0@sha256:f9de845b170155199f2a2a3f9531cf13d78e31235e9db6b6582a8b0db0a50dad
