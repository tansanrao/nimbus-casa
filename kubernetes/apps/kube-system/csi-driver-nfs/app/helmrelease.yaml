---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: csi-driver-nfs
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controller:
      replicas: 1
    storageClass:
      create: true
      name: nfs-slow
      parameters:
        server: sandcrawler.kbcb.tansanrao.net
        share: /tank/nimbus
      mountOptions:
        - nfsvers=4.2
        - nconnect=16
        - hard
        - noatime
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
    image:
      baseRepo: ""
      nfs:
        repository: registry.k8s.io/sig-storage/nfsplugin
        # renovate-image: depName=registry.k8s.io/sig-storage/nfsplugin
        tag: v4.13.6@sha256:40663419bac36836b8e4ef6929199e35920e28f6a74a46892e1c125ea5f0ce0b
      csiProvisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        # renovate-image: depName=registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.4.1@sha256:9e76a2c599ffd7a66f08feeb62ddec61e3545eaa442f8f8f6a495569c0b06829
      csiResizer:
        repository: registry.k8s.io/sig-storage/csi-resizer
        # renovate-image: depName=registry.k8s.io/sig-storage/csi-resizer
        tag: v2.3.1@sha256:d5b040c2f6ffb25127169feeb845aaf1fa3279e510d71fbebe386b5becc625cc
      csiSnapshotter:
        repository: registry.k8s.io/sig-storage/csi-snapshotter
        # renovate-image: depName=registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.7.1@sha256:b534b99edb61a5f95e297da8e2a133d36e27ad098e2f643393986e86f093d425
      livenessProbe:
        repository: registry.k8s.io/sig-storage/livenessprobe
        # renovate-image: depName=registry.k8s.io/sig-storage/livenessprobe
        tag: v2.20.1@sha256:d06ac4f9242654f278d9c8a4e343b0516542bfc614218d469959c6428765e97f
      nodeDriverRegistrar:
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        # renovate-image: depName=registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.18.1@sha256:f847fb218cdf1d0f0fa79772ca6f46e11d25635eb49c06efb5dccd00b5245ef5
