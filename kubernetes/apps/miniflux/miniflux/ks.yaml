---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miniflux
spec:
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: crunchy-pgo-clusters
      namespace: database
    - name: miniflux-isolation
      namespace: miniflux
    - name: external-secrets-access
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/miniflux/miniflux/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: miniflux
  wait: false
  suspend: true
