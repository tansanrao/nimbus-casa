---
# Query UI and API, for you and Grafana. Your network only, like Prometheus.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs
spec:
  hostnames:
    - logs.tansanrao.net
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: victoria-logs
          port: 9428
---
# JSON-lines ingest for TrueNAS's Fluent Bit. The longer prefix outranks the
# UI route's "/", so this path only answers with the credentials below.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs-ingest
  annotations:
    # The UI route already publishes this hostname.
    external-dns.kubernetes.io/controller: none
spec:
  hostnames:
    - logs.tansanrao.net
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /insert/jsonline
      backendRefs:
        - name: victoria-logs
          port: 9428
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: victoria-logs-ingest
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: victoria-logs-ingest
  basicAuth:
    users:
      name: victoria-logs-ingest-users
---
# systemd-journal-upload from the hosts. Before systemd 258 it cannot send
# credentials, so Envoy allows only these client addresses; envoy-internal
# sees them unchanged (Cilium DSR, one node). Keep in sync with the hosts in
# ansible/site.yml that run monitoring_agent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs-journald
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  hostnames:
    - logs.tansanrao.net
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /insert/journald
      backendRefs:
        - name: victoria-logs
          port: 9428
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: victoria-logs-journald
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: victoria-logs-journald
  authorization:
    defaultAction: Deny
    rules:
      - name: hosts
        action: Allow
        principal:
          clientCIDRs:
            - 10.10.1.20/32 # Proxmox, MGMT address
            - 10.10.40.21/32 # connector0, also relaying gw0
            - 10.10.40.23/32 # nexus-kb
            - 10.10.40.24/32 # gitlab0
---
# Every other write and admin path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs-blocked
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  hostnames:
    - logs.tansanrao.net
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /insert
        - path:
            type: PathPrefix
            value: /internal
        - path:
            type: PathPrefix
            value: /delete
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: victoria-logs
          port: 9428
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: victoria-logs-blocked
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: victoria-logs-blocked
  authorization:
    defaultAction: Deny
