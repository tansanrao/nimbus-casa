---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-pushover-secret
  data:
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: pushover
        property: PUSHOVER_USER_KEY
    - secretKey: PUSHOVER_TOKEN
      remoteRef:
        key: pushover
        property: ALERTMANAGER_PUSHOVER_TOKEN
