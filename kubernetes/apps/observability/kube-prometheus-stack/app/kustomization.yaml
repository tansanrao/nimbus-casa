---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./alertmanager-heartbeat.sops.yaml
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./grafanadashboard.yaml
  - ./httproute.yaml
  - ./prometheusrule.yaml
  - ./scrapeconfig.yaml
configMapGenerator:
  - name: grafana-dashboard-node-health
    files:
      - ./resources/node-health.json
  - name: grafana-dashboard-storage-health
    files:
      - ./resources/storage-health.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # The dashboard uses Grafana's ${...} variables.
    kustomize.toolkit.fluxcd.io/substitute: disabled
