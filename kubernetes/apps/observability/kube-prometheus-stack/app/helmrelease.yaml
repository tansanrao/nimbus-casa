---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    cleanPrometheusOperatorObjectNames: true

    alertmanager:
      config:
        route:
          group_by: [cluster, alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: pushover-warning
          routes:
            # Always firing. Each notification is a heartbeat to Gatus on gw0,
            # which pages through Pushover when it stops.
            - receiver: gw0-heartbeat
              matchers: ['alertname = "Watchdog"']
              group_by: [alertname]
              group_wait: 0s
              group_interval: 5m
              # Below group_interval so every 5-minute flush sends. At 5m a
              # flush that lands a moment early is skipped, halving the rate.
              repeat_interval: 1m
            - receiver: "null"
              matchers: ['alertname = "InfoInhibitor"']
            - receiver: "null"
              matchers: ['severity =~ "info|none"']
            - receiver: pushover-critical
              matchers: ['severity = "critical"']
              repeat_interval: 4h
        # One page per failure. The first four are the chart defaults, which
        # this list replaces.
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: [namespace, alertname]
          - source_matchers: ['severity = "warning"']
            target_matchers: ['severity = "info"']
            equal: [namespace, alertname]
          - source_matchers: ['alertname = "InfoInhibitor"']
            target_matchers: ['severity = "info"']
            equal: [namespace]
          - target_matchers: ['alertname = "InfoInhibitor"']
          # A host that is down silences every other alert about it, such as
          # its exporters, journal upload and systemd units. instance =~ ".+"
          # keeps alerts without an instance label out, because Alertmanager
          # treats two missing labels as equal.
          - source_matchers: ['alertname = "HostDown"']
            target_matchers: ['alertname != "HostDown"', 'instance =~ ".+"']
            equal: [instance]
          # gw0 is scraped through connector0.
          - source_matchers: ['alertname = "HostDown"', 'instance = "connector0"']
            target_matchers: ['instance = "gw0"']
          # The chart's TargetDown is per job, with no instance. The hosts
          # outside k8s0 have no namespace label, so this leaves k8s0's own
          # TargetDown alerts alone.
          - source_matchers: ['alertname =~ "HostDown|HostExporterDown"']
            target_matchers: ['alertname = "TargetDown"']
            equal: [job, namespace]
        receivers:
          - name: "null"
          - name: gw0-heartbeat
            webhook_configs:
              - url: https://gw0.kiad.tansanrao.net/api/v1/endpoints/monitoring_alertmanager/external?success=true
                send_resolved: false
                http_config:
                  authorization:
                    credentials_file: /etc/alertmanager/secrets/alertmanager-heartbeat-secret/GATUS_HEARTBEAT_TOKEN
          - name: pushover-critical
            pushover_configs:
              - user_key_file: &pushoverUser /etc/alertmanager/secrets/alertmanager-pushover-secret/PUSHOVER_USER_KEY
                token_file: &pushoverToken /etc/alertmanager/secrets/alertmanager-pushover-secret/PUSHOVER_TOKEN
                priority: "1"
                send_resolved: true
          - name: pushover-warning
            pushover_configs:
              - user_key_file: *pushoverUser
                token_file: *pushoverToken
                priority: "0"
                send_resolved: true
      alertmanagerSpec:
        externalUrl: https://alertmanager.tansanrao.net
        terminationGracePeriodSeconds: 120
        secrets:
          - alertmanager-heartbeat-secret
          - alertmanager-pushover-secret
        storage:
          disableMountSubPath: true
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-lvm
              resources:
                requests:
                  storage: 2Gi

    kubeEtcd:
      service:
        selector:
          component: kube-apiserver

    kubeProxy:
      enabled: false

    prometheus:
      prometheusSpec:
        externalUrl: https://prometheus.tansanrao.net
        terminationGracePeriodSeconds: 120
        retention: 14d
        retentionSize: 50GB
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2000Mi
        storageSpec:
          disableMountSubPath: true
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-lvm
              resources:
                requests:
                  storage: 50Gi

    prometheus-node-exporter:
      fullnameOverride: node-exporter

    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      # OpenEBS LVM thin pool capacity, which no exporter reports.
      # Thin pool metadata usage is not in LVMNode and stays unmonitored.
      rbac:
        extraRules:
          - apiGroups: ["local.openebs.io"]
            resources: ["lvmnodes"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: local.openebs.io
                  version: v1alpha1
                  kind: LVMNode
                labelsFromPath:
                  node: [metadata, name]
                metrics:
                  - name: lvm_thinpool_size_bytes
                    help: Size of the OpenEBS LVM thin pool in bytes.
                    each:
                      type: Gauge
                      gauge:
                        path: [volumeGroups]
                        labelsFromPath:
                          volume_group: [name]
                          thin_pool: [thinPools, "0", name]
                        valueFrom: [thinPools, "0", size]
                  - name: lvm_thinpool_free_bytes
                    help: Free space in the OpenEBS LVM thin pool in bytes.
                    each:
                      type: Gauge
                      gauge:
                        path: [volumeGroups]
                        labelsFromPath:
                          volume_group: [name]
                          thin_pool: [thinPools, "0", name]
                        valueFrom: [thinPools, "0", free]

    grafana:
      enabled: false
      forceDeployDashboards: true
