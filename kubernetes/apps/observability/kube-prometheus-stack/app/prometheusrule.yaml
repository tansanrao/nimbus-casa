---
# Homelab rules the chart does not ship.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-rules
spec:
  groups:
    - name: storage.rules
      rules:
        # Every app and database volume lives in this pool, which is
        # overcommitted. kube-state-metrics reads it from the LVMNode resource.
        - alert: LVMThinPoolFillingUp
          expr: |
            1 - (
              max by (cluster, node, volume_group, thin_pool) (kube_customresource_lvm_thinpool_free_bytes)
              / max by (cluster, node, volume_group, thin_pool) (kube_customresource_lvm_thinpool_size_bytes)
            ) > 0.80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Thin pool {{ $labels.thin_pool }} on {{ $labels.node }} is {{ $value | humanizePercentage }} full
        - alert: LVMThinPoolAlmostFull
          expr: |
            1 - (
              max by (cluster, node, volume_group, thin_pool) (kube_customresource_lvm_thinpool_free_bytes)
              / max by (cluster, node, volume_group, thin_pool) (kube_customresource_lvm_thinpool_size_bytes)
            ) > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Thin pool {{ $labels.thin_pool }} on {{ $labels.node }} is {{ $value | humanizePercentage }} full; writes to every volume stop when it fills
        - alert: LVMThinPoolMetricsAbsent
          expr: absent(kube_customresource_lvm_thinpool_size_bytes)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: kube-state-metrics no longer reports the OpenEBS thin pool, so the thin pool alerts cannot fire

    - name: node.rules
      rules:
        # Memory and filesystem pressure are covered by the chart's
        # NodeMemoryHighUtilization and NodeFilesystem* rules.
        - alert: NodeOOMKill
          expr: increase(node_vmstat_oom_kill[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: The kernel OOM killer stopped a process on {{ $labels.instance }}

    - name: cnpg.rules
      rules:
        - alert: CNPGCollectorDown
          expr: max by (cluster, namespace, pod) (cnpg_collector_up) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CloudNativePG cannot reach PostgreSQL in {{ $labels.namespace }}/{{ $labels.pod }}
        # Daily backups; 26 h allows for a slow run. The Barman plugin metric
        # replaces cnpg_collector_last_available_backup_timestamp, which reads 0.
        - alert: CNPGBackupTooOld
          expr: |
            time() - max by (cluster, namespace, pod) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: The last backup of {{ $labels.namespace }}/{{ $labels.pod }} is {{ $value | humanizeDuration }} old
        - alert: CNPGWALArchivingFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count[15m]) > 0
          labels:
            severity: critical
          annotations:
            summary: WAL archiving to Garage is failing for {{ $labels.namespace }}/{{ $labels.pod }}
        - alert: CNPGConnectionsHigh
          expr: |
            sum by (cluster, namespace, pod) (cnpg_backends_total)
            / max by (cluster, namespace, pod) (cnpg_pg_settings_setting{name="max_connections"}) > 0.80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} uses {{ $value | humanizePercentage }} of max_connections"

    - name: flux.rules
      rules:
        - alert: FluxResourceNotReady
          expr: |
            max by (cluster, exported_namespace, kind, name, reason) (flux_resource_info{ready="False", suspended="False"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready ({{ $labels.reason }})

    - name: cert-manager.rules
      rules:
        # cert-manager renews 30 days before expiry, so 14 days means renewal failed.
        - alert: CertificateExpiringSoon
          expr: |
            min by (cluster, exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds) - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}
        - alert: CertificateNotReady
          expr: |
            max by (cluster, exported_namespace, name) (certmanager_certificate_ready_status{condition="False"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready

    - name: envoy.rules
      rules:
        # Per HTTPRoute, ignoring routes below 3 requests per minute so one
        # failed request on an idle app does not page.
        - alert: EnvoyRouteHighErrorRate
          expr: |
            (
              sum by (cluster, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/.*", envoy_response_code_class="5"}[5m]))
              / sum by (cluster, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/.*"}[5m]))
            ) > 0.05
            and sum by (cluster, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/.*"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.envoy_cluster_name }} returns {{ $value | humanizePercentage }} 5xx responses"

    # Hosts outside Kubernetes, from scrapeconfig.yaml. Their node_exporter
    # shares k8s0's job, so the chart's Node* rules cover memory, filesystems,
    # NIC errors and failed systemd units on them too. Only k8s0's own
    # targets have a namespace label.
    - name: hosts.rules
      rules:
        # gw0 is scraped through connector0, so connector0 going down takes
        # gw0 with it.
        - alert: HostDown
          expr: up{job="node-exporter", namespace=""} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} is unreachable or its node_exporter is down"
        - alert: HostExporterDown
          expr: up{job=~"smartctl|haproxy|pve|garage"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}"
        # Restarts every 30 s while uploads fail, so it is rarely active then.
        - alert: JournalUploadNotRunning
          expr: node_systemd_unit_state{name="systemd-journal-upload.service", state="active"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} is not shipping its journal to VictoriaLogs"
        - alert: HAProxyBackendDown
          expr: haproxy_backend_active_servers == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HAProxy backend {{ $labels.proxy }} on {{ $labels.instance }} has no healthy server"
        - alert: NFSClientRetransmitting
          expr: rate(node_nfs_rpc_retransmissions_total[10m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "NFS requests from {{ $labels.instance }} are being retransmitted; a TrueNAS mount is stalling"
        - alert: HostTemperatureHigh
          expr: max by (instance, chip, sensor) (node_hwmon_temp_celsius) > 80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} sensor {{ $labels.chip }}/{{ $labels.sensor }} is at {{ $value }}°C"

    - name: proxmox.rules
      rules:
        - alert: ProxmoxStorageFilling
          expr: |
            max by (instance, id) (pve_disk_usage_bytes{id=~"storage/.+"})
            / max by (instance, id) (pve_disk_size_bytes{id=~"storage/.+"}) > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox {{ $labels.id }} is {{ $value | humanizePercentage }} full"
        - alert: ProxmoxStorageAlmostFull
          expr: |
            max by (instance, id) (pve_disk_usage_bytes{id=~"storage/.+"})
            / max by (instance, id) (pve_disk_size_bytes{id=~"storage/.+"}) > 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Proxmox {{ $labels.id }} is {{ $value | humanizePercentage }} full; guests on it stop writing when it fills"
        - alert: ProxmoxGuestStopped
          expr: pve_up{id=~"qemu/.+"} == 0 and on (instance, id) pve_onboot_status == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox guest {{ $labels.id }} starts on boot but is not running"

    - name: truenas.rules
      rules:
        - alert: ZFSPoolNotOnline
          expr: node_zfs_zpool_state{state!="online"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} is {{ $labels.state }}"
        # Pool roots only: their free space is the pool's. TrueNAS's own
        # alert covers a pool over 80%.
        - alert: TrueNASPoolFullIn7Days
          expr: |
            predict_linear(node_filesystem_avail_bytes{instance="sandcrawler", fstype="zfs", mountpoint=~"/mnt/[^/.][^/]*"}[3d], 7 * 86400) < 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS {{ $labels.mountpoint }} fills within 7 days at the last 3 days' rate"
        - alert: GarageUnavailable
          expr: cluster_available{job="garage"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Garage on TrueNAS is unavailable; Postgres backups and WAL archiving fail

    # TrueNAS reports through smartctl_exporter (smartctl_*), Proxmox's NVMe
    # drives through the textfile collector (nvme_*). Rules match either.
    - name: disks.rules
      rules:
        - alert: DiskSMARTFailed
          expr: smartctl_device_smart_status == 0
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.instance }} failed its SMART health check"
        - alert: NVMeCriticalWarning
          expr: smartctl_device_critical_warning > 0 or nvme_critical_warning > 0
          labels:
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.instance }} reports critical warning {{ $value }}"
        - alert: NVMeSpareLow
          expr: |
            smartctl_device_available_spare < smartctl_device_available_spare_threshold
            or nvme_available_spare_ratio < nvme_available_spare_threshold_ratio
          labels:
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.instance }} is below its spare threshold"
        - alert: DiskWearHigh
          expr: smartctl_device_percentage_used >= 90 or nvme_percentage_used_ratio * 100 >= 90
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.instance }} has used {{ $value }}% of its rated endurance"
        - alert: DiskMediaErrors
          expr: delta(smartctl_device_media_errors[1h]) > 0 or increase(nvme_media_errors_total[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.instance }} logged new media errors"
        - alert: DiskBadSectorsRising
          expr: |
            delta(smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable", attribute_value_type="raw"}[1d]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.instance }}: {{ $labels.attribute_name }} rose in the last day"
        # The timer rewrites nvme.prom every 15 minutes. A failed run also
        # fires NodeSystemdServiceFailed; this catches a stopped timer.
        - alert: NVMeMetricsStale
          expr: time() - node_textfile_mtime_seconds{file=~".*nvme\\.prom"} > 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NVMe health on {{ $labels.instance }} has not been updated for {{ $value | humanizeDuration }}"
        # TrueNAS disks. NVMe temperatures are covered by HostTemperatureHigh.
        - alert: DiskTemperatureHigh
          expr: smartctl_device_temperature{temperature_type="current"} > 65
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} on {{ $labels.instance }} is at {{ $value }}°C"
