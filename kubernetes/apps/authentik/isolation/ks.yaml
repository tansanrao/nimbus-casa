---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-isolation
spec:
  interval: 1h
  suspend: false
  path: ./kubernetes/apps/authentik/isolation/app
  prune: true
  targetNamespace: authentik
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  wait: true
