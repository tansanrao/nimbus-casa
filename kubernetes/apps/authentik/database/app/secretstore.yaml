---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-secret-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: database-secret-reader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
    resourceNames:
      - auth-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: database-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: database-secret-reader
subjects:
  - kind: ServiceAccount
    name: database-secret-reader
    namespace: authentik
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: authentik-postgres
spec:
  provider:
    kubernetes:
      remoteNamespace: authentik
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: database-secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: authentik-database-secret-review
rules:
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-database-secret-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: authentik-database-secret-review
subjects:
  - kind: ServiceAccount
    name: database-secret-reader
    namespace: authentik
