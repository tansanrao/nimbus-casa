---
# Dedicated to authentik. CloudNativePG generates the "auth-app" secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: auth
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: openebs-lvm
    size: 20Gi
  postgresql:
    parameters:
      max_wal_size: 2GB
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      dataChecksums: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: auth
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 2Gi
