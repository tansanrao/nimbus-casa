---
# Dedicated to authentik. CloudNativePG generates the "auth-app" secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: auth
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: openebs-lvm
    size: 20Gi
  postgresql:
    parameters:
      max_wal_size: 2GB
  bootstrap:
    initdb:
      # Same collation as the Crunchy databases; also inherited by Database resources.
      localeCollate: en_US.UTF-8
      localeCType: en_US.UTF-8
      database: authentik
      owner: authentik
      dataChecksums: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: auth
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 2Gi
