---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: auth-clients
spec:
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: auth
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: authentik
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
