---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  dependsOn:
    - name: authentik-isolation
      namespace: authentik
    - name: barman-cloud
      namespace: database
    - name: onepassword
      namespace: external-secrets
    - name: openebs
      namespace: openebs-system
  interval: 1h
  path: ./kubernetes/apps/authentik/database/app
  postBuild:
    substitute:
      CNPG_CLUSTER: auth
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: authentik
  wait: true
  timeout: 15m
