---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: papers
spec:
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: snapshot-controller
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: paradedb
      namespace: database
    - name: onepassword
      namespace: external-secrets
    - name: papers-isolation
      namespace: papers
    - name: external-secrets-access
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/papers/papers/app
  postBuild:
    substitute:
      APP: papers
      VOLSYNC_CAPACITY: 100Gi
      # The backend and worker both mount the files volume.
      VOLSYNC_STORAGECLASS: openebs-lvm-shared
      VOLSYNC_PUID: "10001"
      VOLSYNC_PGID: "10001"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: papers
  wait: false
  suspend: false
