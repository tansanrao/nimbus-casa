---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radarr
  namespace: media
spec:
  interval: 1h
  path: ./kubernetes/apps/media/radarr/app
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: snapshot-controller
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: onepassword
      namespace: external-secrets
    - name: media-shared
      namespace: media
    - name: vpn-gateway
      namespace: media-vpn
    - name: media-isolation
      namespace: media
    - name: media-database-postgres
      namespace: media-database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: radarr
      VOLSYNC_CAPACITY: 10Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  suspend: false
