# Retain the original volume binding during the namespace cutover.
# Remove the volumeName patch only when intentionally restoring onto a new PV.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ../../../../components/volsync
patches:
  - patch: |-
      $patch: delete
      apiVersion: volsync.backube/v1alpha1
      kind: ReplicationDestination
      metadata:
        name: ${APP}-dst
  - target:
      kind: ReplicationSource
    patch: |-
      - op: add
        path: /spec/restic/moverSecurityContext/runAsNonRoot
        value: true
      - op: add
        path: /spec/restic/moverSecurityContext/seccompProfile
        value:
          type: RuntimeDefault
  - target:
      kind: PersistentVolumeClaim
      name: ${APP}
    patch: |-
      - op: add
        path: /spec/volumeName
        value: pvc-529473a8-7e35-44dc-af1f-530c60a3fa0e
