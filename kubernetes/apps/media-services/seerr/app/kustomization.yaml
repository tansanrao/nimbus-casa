---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ../../../../components/volsync
labels:
  - pairs:
      app.kubernetes.io/name: seerr
      app.kubernetes.io/instance: seerr
      app.kubernetes.io/part-of: seerr
# Fresh installation: do not attempt a restore from the new empty backup repository.
patches:
  - patch: |-
      $patch: delete
      apiVersion: volsync.backube/v1alpha1
      kind: ReplicationDestination
      metadata:
        name: ${APP}-dst
