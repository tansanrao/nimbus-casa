---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyseerr
  namespace: media-services
spec:
  interval: 1h
  path: ./kubernetes/apps/media-services/jellyseerr/app
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: snapshot-controller
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: onepassword
      namespace: external-secrets
    - name: media-services-shared
      namespace: media-services
    - name: media-services-isolation
      namespace: media-services
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media-services
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: jellyseerr
      VOLSYNC_CAPACITY: 15Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  suspend: true
