---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-services-shared
  namespace: media-services
spec:
  interval: 1h
  path: ./kubernetes/apps/media-services/shared/app
  prune: true
  suspend: true
  targetNamespace: media-services
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: csi-driver-nfs
      namespace: kube-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  wait: true
  timeout: 10m
