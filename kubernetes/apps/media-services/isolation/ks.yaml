---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-services-isolation
  namespace: media-services
spec:
  interval: 1h
  suspend: true
  path: ./kubernetes/apps/media-services/isolation/app
  prune: true
  targetNamespace: media-services
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  wait: true
