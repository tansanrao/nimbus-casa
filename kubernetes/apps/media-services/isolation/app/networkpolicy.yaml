---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-movers
spec:
  endpointSelector:
    matchLabels:
      k8s:isolation.nimbus.casa/role: backup
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: s3.kbcb.tansanrao.net
              - matchPattern: c6b94fac3912990d5ba196ac12a2f2ed.r2.cloudflarestorage.com
    - toFQDNs:
        - matchPattern: s3.kbcb.tansanrao.net
        - matchPattern: c6b94fac3912990d5ba196ac12a2f2ed.r2.cloudflarestorage.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
