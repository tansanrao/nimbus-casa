---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ../../../../components/volsync
labels:
  - pairs:
      app.kubernetes.io/name: kavita
      app.kubernetes.io/instance: kavita
      app.kubernetes.io/part-of: kavita
patches:
  - target:
      kind: ReplicationSource
    patch: |-
      - op: add
        path: /spec/paused
        value: true
