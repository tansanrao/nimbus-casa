---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep-browser
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: karakeep-browser
  values:
    fullnameOverride: karakeep-browser
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: 157.0.8103.38-r1@sha256:6c80ed470871bb8c129dc58692ca1714cddbc1392faad3ebf59aecd2e6e58eac
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            probes:
              startup:
                enabled: true
                type: TCP
                spec:
                  tcpSocket:
                    port: 9222
                  failureThreshold: 30
                  periodSeconds: 2
              readiness:
                enabled: true
                type: TCP
                spec:
                  tcpSocket:
                    port: 9222
              liveness:
                enabled: true
                type: TCP
                spec:
                  tcpSocket:
                    port: 9222
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: main
        ports:
          http:
            port: 9222
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
