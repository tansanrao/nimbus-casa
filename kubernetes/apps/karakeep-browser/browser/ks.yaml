---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karakeep-browser
spec:
  interval: 1h
  path: ./kubernetes/apps/karakeep-browser/browser/app
  prune: true
  targetNamespace: karakeep-browser
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  dependsOn:
    - name: karakeep-browser-isolation
