---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-gateway-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: vpn-gateway-secret
    template:
      engineVersion: v2
      data:
        VPN_INTERFACE: wg0
        FIREWALL_ENABLED_DISABLING_IT_SHOOTS_YOU_IN_YOUR_FOOT: on
        # dnsmasq owns port 53; upstream DNS is carried inside WireGuard.
        DNS_SERVER: off
        DNS_KEEP_NAMESERVER: off
        DNS_ADDRESS: 1.1.1.1
        VPN_SERVICE_PROVIDER: mullvad
        VPN_TYPE: wireguard
        WIREGUARD_PRIVATE_KEY: '{{ .VPN_GW_WIREGUARD_PRIVATE_KEY }}'
        WIREGUARD_ADDRESSES: '{{ .VPN_GW_WIREGUARD_ADDRESSES }}'
        PORT_FORWARD_ONLY: off
        VPN_PORT_FORWARDING: off
        WIREGUARD_ENDPOINT_PORT: "51820"
        DNS_UPSTREAM_IPV6: off
        FIREWALL_INPUT_PORTS: "4789"
        FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.10/32
        SERVER_HOSTNAMES: us-qas-wg-101
        WIREGUARD_ENDPOINT_IP: 185.156.46.130
        WIREGUARD_ALLOWED_IPS: 0.0.0.0/0
        UPDATER_PERIOD: "0"
        DNS_UPDATE_PERIOD: "0"
        BLOCK_MALICIOUS: off
  dataFrom:
    - extract:
        key: vpn-gateway
