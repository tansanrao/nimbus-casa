---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-gateway
spec:
  interval: 1h
  chart:
    spec:
      chart: pod-gateway
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: angelnu-charts
      interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/angelnu/pod-gateway
              tag: v1.13.0@sha256:a5b032e15f7570493977b330a5a86dcffebb807d35685ad803e47afb62d105f2
          gluetun:
            enabled: true
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            envFrom:
              - secretRef:
                  name: vpn-gateway-secret
            resources:
              limits:
                devic.es/tun: "1"
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
        pod:
          annotations:
            configmap.reloader.stakater.com/reload: media-vpn,vpn-gateway-dnssec-trust-anchors,vpn-gateway-firewall
            secret.reloader.stakater.com/reload: vpn-gateway-secret
      webhook:
        containers:
          main:
            image:
              repository: ghcr.io/angelnu/gateway-admision-controller
              tag: v3.12.0@sha256:6f6ab596afd5fef0ca4648eadfb21cd37ba86fa5afa8b85edcc072976a61fbed
    persistence:
      dnssec-trust-anchors:
        type: configMap
        name: vpn-gateway-dnssec-trust-anchors
        advancedMounts:
          main:
            main:
              - path: /usr/share/dnsmasq/trust-anchors.conf
                subPath: trust-anchors.conf
                readOnly: true
      firewall:
        type: configMap
        name: vpn-gateway-firewall
        advancedMounts:
          main:
            gluetun:
              - path: /iptables/post-rules.txt
                subPath: post-rules.txt
                readOnly: true
            main:
              - path: /etc/dnsmasq.d/eth0.conf
                subPath: eth0.conf
                readOnly: true
            routes:
              - path: /isolation/forward-guard.sh
                subPath: forward-guard.sh
                readOnly: true
    DNS: 10.43.0.53
    routed_namespaces:
      - media
    settings:
      VPN_INTERFACE: wg0
      VXLAN_ID: 44
      VXLAN_IP_NETWORK: 172.16.1
      VXLAN_GATEWAY_FIRST_DYNAMIC_IP: 20
      VPN_BLOCK_OTHER_TRAFFIC: true
      VPN_TRAFFIC_PORT: "51820"
      VPN_LOCAL_CIDRS: 10.42.0.0/16 10.43.0.10/32
      NOT_ROUTED_TO_GATEWAY_CIDRS: 10.42.0.0/16 10.43.0.0/16
      DNS_LOCAL_CIDRS: cluster.local
      VXLAN_PORT: 4789
      DNS_LOCAL_SERVER: 10.43.0.10
    webhook:
      gatewayDefault: false
      gatewayLabel: setGateway
      gatewayAnnotation: setGateway
      namespaceSelector:
        type: custom
        custom:
          matchLabels:
            kubernetes.io/metadata.name: media
      sidecarAsInit: true
    fullnameOverride: media-vpn
    service:
      dns:
        controller: main
        clusterIP: 10.43.0.54
        ports:
          dns:
            port: 53
            protocol: UDP
          dns-tcp:
            port: 53
            protocol: TCP
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: MutatingWebhookConfiguration
              name: media-vpn
            patch: '[{"op": "add", "path": "/webhooks/0/failurePolicy", "value": "Fail"}, {"op": "add", "path": "/webhooks/0/objectSelector", "value": {"matchLabels": {"isolation.nimbus.casa/zone": "untrusted"}}}]'
          - target:
              kind: Deployment
              name: media-vpn-main
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: media-vpn-main
              spec:
                template:
                  spec:
                    initContainers:
                      - name: routes
                        command:
                          - /bin/bash
                          - -ec
                          - /bin/gateway_init.sh; /bin/bash /isolation/forward-guard.sh
