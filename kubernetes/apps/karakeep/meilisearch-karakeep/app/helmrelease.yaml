---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meilisearch-karakeep
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: meilisearch-karakeep
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
    controllers:
      meilisearch-karakeep:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
            args:
              - /bin/meilisearch
              - --upgrade-db
            env:
              MEILI_NO_ANALYTICS: "true"
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: meilisearch-karakeep
                    key: MEILI_MASTER_KEY
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: meilisearch-karakeep
        primary: true
        ports:
          http:
            port: 7700
    persistence:
      data:
        enabled: true
        existingClaim: meilisearch-karakeep
        advancedMounts:
          meilisearch-karakeep:
            app:
              - path: /meili_data
      tmp:
        type: emptyDir
        advancedMounts:
          meilisearch-karakeep:
            app:
              - path: /tmp
