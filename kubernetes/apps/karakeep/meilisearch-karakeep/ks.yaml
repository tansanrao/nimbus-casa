---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: meilisearch-karakeep
  namespace: karakeep
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: meilisearch-karakeep
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: snapshot-controller
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: onepassword
      namespace: external-secrets
    - name: karakeep-isolation
      namespace: karakeep
    - name: external-secrets-access
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/karakeep/meilisearch-karakeep/app
  postBuild:
    substitute:
      APP: meilisearch-karakeep
      VOLSYNC_CAPACITY: 10Gi
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: karakeep
  wait: false
  suspend: true
