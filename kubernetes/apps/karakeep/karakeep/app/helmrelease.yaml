---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: karakeep
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      karakeep:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          runtime-directory:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
            command:
              - /bin/sh
              - -c
            args:
              - mkdir -p /runtime/run && chmod 0700 /runtime/run
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            envFrom:
              - secretRef:
                  name: karakeep-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: karakeep
        primary: true
        ports:
          http:
            port: 3000
    persistence:
      runtime:
        type: emptyDir
        sizeLimit: 64Mi
        advancedMounts:
          karakeep:
            runtime-directory:
              - path: /runtime
            app:
              - path: /run
                subPath: run
      data:
        enabled: true
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            app:
              - path: /data
                subPath: karakeep
      tmp:
        type: emptyDir
        advancedMounts:
          karakeep:
            app:
              - path: /tmp
    route:
      main:
        hostnames:
          - karakeep.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
