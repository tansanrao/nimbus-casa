---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karakeep
spec:
  dependsOn:
    - name: karakeep-browser
      namespace: karakeep-browser
    - name: openebs
      namespace: openebs-system
    - name: snapshot-controller
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: onepassword
      namespace: external-secrets
    - name: meilisearch-karakeep
      namespace: karakeep
    - name: karakeep-isolation
      namespace: karakeep
    - name: external-secrets-access
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/karakeep/karakeep/app
  postBuild:
    substitute:
      APP: karakeep
      VOLSYNC_CAPACITY: 15Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: karakeep
  wait: false
  suspend: false
