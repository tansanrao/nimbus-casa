---
# Shared cluster for applications that need plain PostgreSQL.
# To add an application: add a role secret, a managed role and a Database.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: openebs-lvm
    size: 20Gi
  postgresql:
    parameters:
      max_wal_size: 2GB
  bootstrap:
    initdb:
      # Collation the data was created with; Database resources inherit it.
      localeCollate: en_US.UTF-8
      localeCType: en_US.UTF-8
      database: mealie
      owner: mealie
      secret:
        name: postgres-mealie
      dataChecksums: true
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
  managed:
    roles:
      - name: mealie
        ensure: present
        login: true
        passwordSecret:
          name: postgres-mealie
      - name: miniflux
        ensure: present
        login: true
        passwordSecret:
          name: postgres-miniflux
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 2Gi
