---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-secret-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-secret-reader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
    resourceNames:
      - postgres-mealie
      - postgres-miniflux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-secret-reader
subjects:
  - kind: ServiceAccount
    name: postgres-secret-reader
    namespace: database
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: database-postgres-secret-review
rules:
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: database-postgres-secret-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: database-postgres-secret-review
subjects:
  - kind: ServiceAccount
    name: postgres-secret-reader
    namespace: database
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: database-postgres
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: database
      auth:
        serviceAccount:
          name: postgres-secret-reader
          namespace: database
  conditions:
    - namespaces:
        - mealie
        - miniflux
