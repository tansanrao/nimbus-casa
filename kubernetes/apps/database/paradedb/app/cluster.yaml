---
# Shared cluster for applications that use ParadeDB's pg_search.
# initdb creates an empty "app" database (owner "app", secret "paradedb-app").
# To add an application: add a role secret, a managed role, a Database with
# the pg_search extension, and a policy that lets its pods reach 5432.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paradedb
spec:
  instances: 1
  imageName: docker.io/paradedb/paradedb:18-v0.27.1@sha256:5b4acb9de782433c2c990d2285dcc66db7bf85a1f3b2bc2025ac4660408193e3
  # The ParadeDB image is based on the Docker Official postgres image.
  postgresUID: 999
  postgresGID: 999
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: openebs-lvm
    size: 20Gi
  postgresql:
    shared_preload_libraries:
      - pg_search
    parameters:
      max_wal_size: 2GB
  bootstrap:
    initdb:
      # Collation the data was created with; Database resources inherit it.
      localeCollate: en_US.UTF-8
      localeCType: en_US.UTF-8
      dataChecksums: true
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_search CASCADE;
  managed:
    roles:
      # Links: migrations own the schema; the API and workers only use the data.
      - name: links_migrator
        ensure: present
        login: true
        passwordSecret:
          name: paradedb-links-migrator
      - name: links_app
        ensure: present
        login: true
        passwordSecret:
          name: paradedb-links-app
      # Papers: the same split as Links.
      - name: papers_migrator
        ensure: present
        login: true
        passwordSecret:
          name: paradedb-papers-migrator
      - name: papers_app
        ensure: present
        login: true
        passwordSecret:
          name: paradedb-papers-app
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paradedb
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 2Gi
