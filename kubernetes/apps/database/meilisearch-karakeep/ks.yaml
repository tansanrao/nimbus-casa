---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: meilisearch-karakeep
  namespace: database
  labels:
    isolation.nimbus.casa/legacy-hold: "true"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: meilisearch-karakeep
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: snapshot-controller
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: onepassword
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/database/meilisearch-karakeep/app
  postBuild:
    substitute:
      APP: meilisearch-karakeep
      VOLSYNC_CAPACITY: 10Gi
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: false
  suspend: true
  deletionPolicy: Orphan
