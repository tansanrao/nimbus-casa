---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-pg
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
    resourceNames:
      - postgres16-pguser-authentik
      - postgres16-pguser-jellystat
      - postgres16-pguser-karakeep
      - postgres16-pguser-mealie
      - postgres16-pguser-miniflux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-pg
subjects:
  - kind: ServiceAccount
    name: external-secrets-pg
    namespace: database
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-pg
  namespace: database
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-pg
rules:
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-pg
subjects:
  - kind: ServiceAccount
    name: external-secrets-pg
    namespace: database
