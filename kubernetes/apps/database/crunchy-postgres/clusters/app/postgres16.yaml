---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: &name postgres16
spec:
  postgresVersion: 18
  image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres:ubi9-18.6-2633@sha256:eb80bdfcb4d995f6a591b16deaa56932802d5b9f984c4c8e558ff11da3187ec3

  monitoring:
    pgmonitor:
      exporter:
        resources:
          requests:
            cpu: 10m
            memory: 64M
          limits:
            memory: 2G

  metadata:
    labels:
      postgres-operator.crunchydata.com/crunchy-postgres-exporter: "true"
      postgres-operator.crunchydata.com/cluster: *name

  service:
    type: LoadBalancer
    metadata:
      annotations:
        external-dns.kubernetes.io/hostname: postgres16.${SECRET_DOMAIN}
        lbipam.cilium.io/ips: 10.10.40.73

  patroni:
    dynamicConfiguration:
      synchronous_mode: true
      postgresql:
        max_wal_size: 2GB
        synchronous_commit: "on"
        pg_hba:
          - hostnossl all all 10.42.0.0/16 md5
          - hostssl all all all md5

  instances:
    - name: postgres
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres
      replicas: &replica 1
      dataVolumeClaimSpec:
        storageClassName: openebs-lvm
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi

  users:
    - name: postgres
      databases: [postgres]
      options: SUPERUSER
      password:
        type: AlphaNumeric
    - name: miniflux
      databases: [miniflux]
      password:
        type: AlphaNumeric
    - name: authentik
      databases: [authentik]
      password:
        type: AlphaNumeric
    - name: radarr
      databases: [radarr_main]
      password:
        type: AlphaNumeric
    - name: sonarr
      databases: [sonarr_main]
      password:
        type: AlphaNumeric
    - name: sonarr-anime
      databases: [sonarr_anime_main]
      password:
        type: AlphaNumeric
    - name: prowlarr
      databases: [prowlarr_main]
      password:
        type: AlphaNumeric
    - name: karakeep
      databases: [karakeep]
      password:
        type: AlphaNumeric
    - name: mealie
      databases: [mealie]
      password:
        type: AlphaNumeric
    - name: jellystat
      databases: [jellystat]
      password:
        type: AlphaNumeric

  backups:
    pgbackrest:
      configuration: &backupConfig
        - secret:
            name: crunchy-postgres-secret
      global: &backupFlag
        compress-type: bz2
        compress-level: "9"
        repo1-bundle: "y"
        repo1-block: "y"
        repo1-path: /postgres16
        repo1-retention-full: "30"
        repo1-retention-full-type: time
        repo1-s3-uri-style: path
        repo1-storage-verify-tls: "n"
        repo2-block: "y"
        repo2-bundle: "y"
        repo2-path: /postgres16
        repo2-retention-full: "7"
        repo2-retention-full-type: time
        repo2-s3-uri-style: path
      manual:
        repoName: repo1
        options:
          - --type=full
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres-backup
      repos:
        - name: repo1
          s3: &minio
            bucket: crunchy-pgo
            endpoint: s3.kbcb.tansanrao.net
            region: garage
          schedules:
            full: 0 1 * * 0
            differential: 0 1 * * 1-6
            incremental: 0 2-23 * * *
        - name: repo2
          s3: &r2
            bucket: crunchy-pgo
            endpoint: c6b94fac3912990d5ba196ac12a2f2ed.r2.cloudflarestorage.com
            region: us-east-1
          schedules:
            full: 0 2 * * 0
            incremental: 0 2 * * 1-6

  # dataSource:
  #   pgbackrest:
  #     stanza: db
  #     configuration: *backupConfig
  #     global: *backupFlag
  #     repo:
  #       name: repo1
  #       s3: *minio
