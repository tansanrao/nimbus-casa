---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-secret-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: database-secret-reader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
    resourceNames:
      - media16-pguser-prowlarr
      - media16-pguser-radarr
      - media16-pguser-sonarr
      - media16-pguser-sonarr-anime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: database-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: database-secret-reader
subjects:
  - kind: ServiceAccount
    name: database-secret-reader
    namespace: media-database
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: media-postgres
spec:
  provider:
    kubernetes:
      remoteNamespace: media-database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: media-database
      auth:
        serviceAccount:
          name: database-secret-reader
          namespace: media-database
  conditions:
    - namespaces:
        - media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: media-database-database-secret-review
rules:
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: media-database-database-secret-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: media-database-database-secret-review
subjects:
  - kind: ServiceAccount
    name: database-secret-reader
    namespace: media-database
