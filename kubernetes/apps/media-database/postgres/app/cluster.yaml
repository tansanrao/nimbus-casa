---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: media16
spec:
  postgresVersion: 16
  monitoring:
    pgmonitor:
      exporter:
        resources:
          requests:
            cpu: 10m
            memory: 64M
          limits:
            memory: 2G
  metadata:
    labels:
      postgres-operator.crunchydata.com/crunchy-postgres-exporter: "true"
      postgres-operator.crunchydata.com/cluster: media16
  service:
    type: ClusterIP
  patroni:
    dynamicConfiguration:
      synchronous_mode: true
      postgresql:
        max_wal_size: 2GB
        synchronous_commit: on
        pg_hba:
          - hostnossl all all 10.42.0.0/16 md5
          - hostssl all all all md5
  instances:
    - name: postgres
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres
      replicas: 1
      dataVolumeClaimSpec:
        storageClassName: openebs-lvm
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
  users:
    - name: postgres
      databases:
        - postgres
      options: SUPERUSER
      password:
        type: AlphaNumeric
    - name: radarr
      databases:
        - radarr_main
      password:
        type: AlphaNumeric
    - name: sonarr
      databases:
        - sonarr_main
      password:
        type: AlphaNumeric
    - name: sonarr-anime
      databases:
        - sonarr_anime_main
      password:
        type: AlphaNumeric
    - name: prowlarr
      databases:
        - prowlarr_main
      password:
        type: AlphaNumeric
  backups:
    pgbackrest:
      configuration:
        - secret:
            name: crunchy-postgres-secret
      global:
        compress-type: bz2
        compress-level: "9"
        repo1-bundle: y
        repo1-block: y
        repo1-path: /isolation/media-database/media16
        repo1-retention-full: "30"
        repo1-retention-full-type: time
        repo1-s3-uri-style: path
        repo1-storage-verify-tls: n
        repo2-block: y
        repo2-bundle: y
        repo2-path: /isolation/media-database/media16
        repo2-retention-full: "7"
        repo2-retention-full-type: time
        repo2-s3-uri-style: path
      manual:
        repoName: repo1
        options:
          - --type=full
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres-backup
      repos:
        - name: repo1
          s3:
            bucket: crunchy-pgo
            endpoint: s3.kbcb.tansanrao.net
            region: garage
          schedules:
            full: 0 1 * * 0
            differential: 0 1 * * 1-6
            incremental: 0 2-23 * * *
        - name: repo2
          s3:
            bucket: crunchy-pgo
            endpoint: c6b94fac3912990d5ba196ac12a2f2ed.r2.cloudflarestorage.com
            region: us-east-1
          schedules:
            full: 0 2 * * 0
            incremental: 0 2 * * 1-6
