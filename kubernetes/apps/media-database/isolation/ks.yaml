---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-database-isolation
  namespace: media-database
spec:
  interval: 1h
  suspend: false
  path: ./kubernetes/apps/media-database/isolation/app
  prune: true
  targetNamespace: media-database
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  wait: true
