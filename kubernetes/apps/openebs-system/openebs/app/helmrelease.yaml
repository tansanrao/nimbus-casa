---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chartRef:
    kind: OCIRepository
    name: openebs
  interval: 1h
  values:
    preUpgradeHook:
      enabled: false
    localpv-provisioner:
      analytics:
        enabled: false
      localpv:
        image:
          registry: quay.io
          repository: openebs/provisioner-localpv
          tag: 4.6.0@sha256:99f5116f5cb83fb9d046ef5ff5b8ea98da90e7da5250d7b101bd650662238a0a
        basePath: /var/mnt/local-hostpath
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: true
        basePath: /var/mnt/local-hostpath
      helperPod:
        image:
          registry: quay.io
          repository: openebs/linux-utils
          tag: 4.6.0@sha256:a3043d266b1c06fb42377ced0c3fc190c66e1e83ae1efda7670ed73feb4ede14
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
          keep: false
    zfs-localpv:
      enabled: false
    lvm-localpv:
      enabled: true
      lvmNode:
        driverRegistrar:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-node-driver-registrar
            pullPolicy: IfNotPresent
            tag: v2.13.0@sha256:d7138bcc3aa5f267403d45ad4292c95397e421ea17a0035888850f424c7de25d
      lvmController:
        resizer:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-resizer
            pullPolicy: IfNotPresent
            tag: v2.0.0@sha256:4a95d94e57ad82f6977cd8d4fdcfcfc0b83f02d990e4e7715b688c20970a906d
        snapshotter:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-snapshotter
            pullPolicy: IfNotPresent
            tag: v8.2.0@sha256:dd788d79cf4c1b8edee6d9b80b8a1ebfc51a38a365c5be656986b129be9ac784
        snapshotController:
          image:
            registry: registry.k8s.io
            repository: sig-storage/snapshot-controller
            pullPolicy: IfNotPresent
            tag: v8.2.0@sha256:9dade8f2f3ab29e3919c41b343f8d77b12178ac51f25574d7ed2d45a3e3ef69d
        provisioner:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-provisioner
            pullPolicy: IfNotPresent
            tag: v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
      lvmPlugin:
        image:
          registry: docker.io
          repository: openebs/lvm-driver
          pullPolicy: IfNotPresent
          tag: 1.10.1@sha256:41f73aba7f31eee4a033053d9c2f203e007a838c14823f3fd472c50651a98999
    mayastor:
      enabled: false
    engines:
      local:
        lvm:
          enabled: true
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    minio:
      enabled: false
