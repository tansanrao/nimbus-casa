---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chartRef:
    kind: OCIRepository
    name: openebs
  interval: 1h
  values:
    preUpgradeHook:
      enabled: false
    localpv-provisioner:
      analytics:
        enabled: false
      localpv:
        image:
          registry: quay.io
          repository: openebs/provisioner-localpv
          tag: 4.6.0@sha256:99f5116f5cb83fb9d046ef5ff5b8ea98da90e7da5250d7b101bd650662238a0a
        basePath: /var/mnt/local-hostpath
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: true
        basePath: /var/mnt/local-hostpath
      helperPod:
        image:
          registry: quay.io
          repository: openebs/linux-utils
          tag: 4.6.0@sha256:a3043d266b1c06fb42377ced0c3fc190c66e1e83ae1efda7670ed73feb4ede14
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
          keep: false
    zfs-localpv:
      enabled: false
    lvm-localpv:
      enabled: true
      lvmNode:
        driverRegistrar:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-node-driver-registrar
            pullPolicy: IfNotPresent
            tag: v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
      lvmController:
        resizer:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-resizer
            pullPolicy: IfNotPresent
            tag: v2.3.0@sha256:48fb3deb93cd848e3c8998b6368f4322c93bb5ce4a90d1307b6dda0dbefb9a0e
        snapshotter:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-snapshotter
            pullPolicy: IfNotPresent
            tag: v8.7.0@sha256:b03d3334f8035fa42660b166f6eb819a659a14774da020eb1b6c52cd422eaadb
        snapshotController:
          image:
            registry: registry.k8s.io
            repository: sig-storage/snapshot-controller
            pullPolicy: IfNotPresent
            tag: v8.7.0@sha256:8511f417d0072efcd937aedd7cc79a937d5066e64ee17beb6097301c92742f19
        provisioner:
          image:
            registry: registry.k8s.io
            repository: sig-storage/csi-provisioner
            pullPolicy: IfNotPresent
            tag: v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
      lvmPlugin:
        image:
          registry: docker.io
          repository: openebs/lvm-driver
          pullPolicy: IfNotPresent
          tag: 1.10.1@sha256:41f73aba7f31eee4a033053d9c2f203e007a838c14823f3fd472c50651a98999
    mayastor:
      enabled: false
    engines:
      local:
        lvm:
          enabled: true
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    minio:
      enabled: false
