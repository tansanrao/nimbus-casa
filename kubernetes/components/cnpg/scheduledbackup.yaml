---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: "${CNPG_CLUSTER}-daily"
spec:
  # Six fields, starting with seconds: 03:00 every day.
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: "${CNPG_CLUSTER}"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
