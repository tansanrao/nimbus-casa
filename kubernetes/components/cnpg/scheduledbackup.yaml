---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: "${CNPG_CLUSTER}-daily"
spec:
  # Six fields, starting with seconds: 07:00 UTC (02:00 EST / 03:00 EDT).
  schedule: "0 0 7 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: "${CNPG_CLUSTER}"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
