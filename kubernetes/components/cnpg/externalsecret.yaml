---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${CNPG_CLUSTER}-backup"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: "${CNPG_CLUSTER}-backup-secret"
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .GARAGE_ACCESS_KEY }}"
        ACCESS_SECRET_KEY: "{{ .GARAGE_SECRET_KEY }}"
        REGION: garage
  dataFrom:
    - extract:
        key: garage
